# Боевой конфиг. Скопируйте в config.toml (он в .gitignore — пароли в git не попадут).

[db]
host     = "IP-сервера-базы"
port     = 3306
user     = "turnstile"
password = "сложный-пароль"
database = "имя-базы-ISU"
charset  = "utf8"

[sync]
view         = "v_turnstile_xobgoh"       # создаётся из turnstile_view.sql поверх view_xobgoh_resident
dry_run      = true                       # ПЕРВЫЙ запуск — только true! Посмотреть лог, потом false.
max_attempts = 5
retry_delays = [2, 5, 15, 60]
after_fail   = 3600
# TRUNCATE / ALTER / CREATE VIEW по этим именам → полная сверка (таблицы из [watch] добавляются сами)
resync_on    = ["view_xobgoh_resident", "v_turnstile_xobgoh"]

# Таблица под вьюхой и колонка со student_id
[watch]
_____list_xobgoh = "student_id"

# Проходы: турникеты → база. Перед включением прочитайте README, раздел «Проходы».
[events]
enabled          = false          # включить после приёмки синхронизации карт
listen_port      = 60001          # UDP-порт на сервере коннектора для push от контроллеров
listener_address = "IP-сервера-коннектора"   # как его видят контроллеры из 192.168.140.x; "" = не перенастраивать контроллеры
poll_seconds     = 30             # страховочная сверка; если push запрещён сетью — listen_port = 0 и poll_seconds = 1
history_on_first_start = false    # старая история уже в базе через N3000 — не дублировать
sync_time_hours  = 24             # часы контроллеров по серверу раз в сутки (0 = не трогать)

[http]
port  = 8090                              # если меняете — поменяйте и HEALTHCHECK в Dockerfile
token = "длинный-случайный-токен-латиницей"

[[controllers]]
sn    = 223218042
ip    = "192.168.140.22"                  # сверьте с новой настройкой N3000
doors = [1, 2]

[[controllers]]
sn    = 123228092
ip    = "192.168.140.13"
doors = [1]
