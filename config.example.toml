# Боевой конфиг. Скопируйте в config.toml (он в .gitignore — пароли в git не попадут).

[db]
host     = "IP-сервера-базы"
port     = 3306
user     = "turnstile"                    # отдельный пользователь, см. turnstile_connector.sql
password = "сложный-пароль"
database = "turnstile_db"            # коннектор работает в своей базе; вьюхи в ней тянут источник из базы ISU
charset  = "utf8"

[sync]
view         = "v_turnstile_xobgoh"       # в turnstile_db (turnstile_view.sql); тянет kbtut_project.view_xobgoh_resident
dry_run      = true                       # ПЕРВЫЙ запуск — только true! Посмотреть лог, потом false.
max_attempts = 5
retry_delays = [2, 5, 15, 60]
after_fail   = 3600
reconcile_at = "03:00"                    # ночная полная сверка — страховка, если изменение прошло мимо вебхука; "" — выкл.

# Вебхук: его вызывает ISU после изменения списка жильцов (php/turnstile_notify.php).
[http]
bind  = "0.0.0.0"                         # слушать на всех адресах; доступ ограничивает брандмауэр (install_service.ps1)
port  = 8090
token = "длинный-случайный-токен-латиницей-от-16-символов"

# Проходы: турникеты → база. Короткий протокол контроллеры не пушат — коннектор
# опрашивает их сам (поллинг). Перед включением прочитайте README, часть 4.
[events]
enabled          = false                  # включить после приёмки синхронизации карт
poll_seconds     = 2                      # как часто опрашивать контроллеры, сек
history_on_first_start = false            # старая история уже в базе через N3000 — не дублировать

[log]
file   = "logs/connector.log"             # файл лога с ротацией
max_mb = 10
keep   = 10

# directions — направление по двери для журнала проходов: "in" (вход) / "out" (выход).
# По умолчанию дверь 1 = "in", дверь 2 = "out" (как в текущей установке) — можно не указывать.
[[controllers]]
sn    = 123228092
ip    = "192.168.140.22"                  # сверьте с настройкой N3000
doors = [1, 2]
directions = { 1 = "in", 2 = "out" }

[[controllers]]
sn    =  223218042
ip    = "192.168.140.13"
doors = [1, 2]
directions = { 1 = "in", 2 = "out" }
